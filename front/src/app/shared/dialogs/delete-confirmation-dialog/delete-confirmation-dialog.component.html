<h2 mat-dialog-title>{{ data.title | transloco }}</h2>
<mat-dialog-content>
    <div class="dialog-content">
        <mat-icon class="warning-icon">warning</mat-icon>
        <div class="message">
            <p [innerHTML]="getTranslatedMessage()"></p>
        </div>
    </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-button type="button" (click)="onCancel()">
        {{ 'common.cancel' | transloco }}
    </button>
    <button mat-raised-button [color]="data.confirmColor ?? 'warn'" type="button" (click)="onConfirm()">
        {{ (data.confirmLabel ?? 'common.delete') | transloco }}
    </button>
</mat-dialog-actions>
